services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    volumes:
      - db_data:/var/lib/mysql

  nextcloud:
    # Must stay within the app's supported range (appinfo/info.xml: NC 27–34).
    # Override via NC_IMAGE, e.g. NC_IMAGE=nextcloud:34 (always `make stop-nc`
    # first when switching images — the DB volume cannot be downgraded).
    image: ${NC_IMAGE:-nextcloud:32}
    depends_on:
      - db
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: adminpassword
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    ports:
      - "${NC_PORT:-8080}:80"
    volumes:
      # App repo, mounted read-only at a neutral path; seed.sh copies it into
      # custom_apps with www-data ownership (a direct mount at custom_apps/
      # breaks Nextcloud's writable-app-root check under rootless podman).
      # :z = SELinux label for Fedora/RHEL hosts.
      - ../..:/opt/audit_export_src:ro,z

volumes:
  db_data:
